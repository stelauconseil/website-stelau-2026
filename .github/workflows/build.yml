name: Verify and deploy Stelau

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild dated blog posts every day (UTC).
  schedule:
    - cron: '15 5 * * *'

permissions:
  contents: read

jobs:
  build:
    name: Verify static site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check, build, index search and verify links
        run: npm run verify
      - name: Read GitHub Pages address
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Verify production domain
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import config from './astro.config.mjs';
          const deployed = new URL(process.env.PAGES_URL);
          const expected = new URL(config.site);
          // GitHub may report HTTP while the first TLS certificate is pending.
          assert.ok(['http:', 'https:'].includes(deployed.protocol));
          assert.equal(deployed.host, expected.host,
            'Configure Settings > Pages > Custom domain as www.stelau.com before deploying.');
          assert.equal(deployed.pathname.replace(/\/$/, ''), '',
            'This site must be served at the domain root, without a repository prefix.');
          NODE
      - name: Upload GitHub Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
